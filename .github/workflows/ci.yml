name: ci

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release --bin cursor-smooth
      - name: CLI preflight (no interception)
        run: |
          ./target/release/cursor-smooth --help > /dev/null
          ./target/release/cursor-smooth --version > /dev/null
          set +e
          ./target/release/cursor-smooth run --hz 500 > /dev/null 2>&1
          legacy=$?
          set -e
          echo "legacy option exit: $legacy"
          test "$legacy" -eq 2
      - name: Replay self-check
        run: |
          cargo run --locked --release --bin cursor-smooth-probe -- replay --self-check
          exit 0

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release --bins
      - name: CLI preflight (no interception)
        shell: pwsh
        run: |
          ./target/release/cursor-smooth.exe --help | Out-Null
          ./target/release/cursor-smooth.exe --version | Out-Null
          ./target/release/cursor-smooth.exe doctor | Out-Null
          $ErrorActionPreference = 'Continue'
          ./target/release/cursor-smooth.exe run --simulate 2>$null | Out-Null
          $legacy = $LASTEXITCODE
          Write-Host "legacy option exit: $legacy"
          if ($legacy -ne 2) { exit 1 }
          exit 0
      - name: Replay self-check
        run: |
          cargo run --locked --release --bin cursor-smooth-probe -- replay --self-check
          exit 0
      - name: Tray build and selftest
        shell: pwsh
        run: |
          ./tray/build.ps1
          ./tray/bin/CursorSmoothTray.exe --selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release --bins
      - name: Linkage
        run: |
          file target/release/cursor-smooth
          otool -L target/release/cursor-smooth
      - name: CLI preflight (permission denial is a tested path)
        run: |
          ./target/release/cursor-smooth --help > /dev/null
          ./target/release/cursor-smooth --version > /dev/null
          set +e
          ./target/release/cursor-smooth doctor > /dev/null
          status=$?
          set -e
          echo "doctor exit: $status"
          # 0 with permissions, 3 without; never a crash or a prompt.
          test "$status" -eq 0 -o "$status" -eq 3
      - name: Replay self-check
        run: |
          ./target/release/cursor-smooth-probe replay --self-check
          exit 0

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release --bins
      - name: Linkage
        run: |
          file target/release/cursor-smooth
          otool -L target/release/cursor-smooth
      - name: CLI preflight (permission denial is a tested path)
        run: |
          ./target/release/cursor-smooth --help > /dev/null
          set +e
          ./target/release/cursor-smooth doctor > /dev/null
          status=$?
          set -e
          echo "doctor exit: $status"
          test "$status" -eq 0 -o "$status" -eq 3
      - name: Replay self-check
        run: |
          ./target/release/cursor-smooth-probe replay --self-check
          exit 0
