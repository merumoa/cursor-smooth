[package]
name = "cursor-smooth"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Low-CPU 1000 Hz software cursor smoothing for Windows, with experimental macOS support"
repository = "https://github.com/merumoa/cursor-smooth"
authors = ["merumoa <87245516+merumoa@users.noreply.github.com>"]
publish = false

[dependencies]
rtrb = "=0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
foreign-types = "=0.5.0"

[features]
default = []
diagnostics = []

[[bin]]
name = "cursor-smooth"
path = "src/main.rs"

[[bin]]
name = "cursor-smooth-probe"
path = "src/bin/cursor-smooth-probe.rs"

[profile.release]
codegen-units = 1
lto = "thin"
